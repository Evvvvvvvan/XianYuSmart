# Machine-readable catalog of implicit state machines in xianyuSmart.
# Companion to README.md. Every `evidence` entry is `file:line` (or `file:line-line`).
# `guard` is what the code actually enforces; `none` means the transition is unguarded.
version: 1
audited_version: "2.1.1"
machines:

  # ─────────────────────────────── connection & credentials ───────────────────────────────
  - id: WS-1
    name: Account connection lifecycle
    subsystem: connection
    storage: memory
    store_ref: WebSocketServiceImpl:78-125 (12 concurrent maps)
    states: [stopped_manual, connecting, connected, stale_connected, reconnect_wait, token_expired, captcha_wait]
    drivers: [http_request, scheduler, websocket_callback]
    transitions:
      - {from: absent,      to: connecting,       trigger: startWebSocket,              guard: per-account lock, evidence: "WebSocketServiceImpl:140-157"}
      - {from: connecting,  to: connected,        trigger: connectBlocking+initialize,  guard: none, evidence: "WebSocketServiceImpl:392-404"}
      - {from: connected,   to: reconnect_wait,   trigger: onClose(remote),             guard: "!intentionalClose", evidence: "WebSocketServiceImpl:357-365"}
      - {from: connected,   to: reconnect_wait,   trigger: heartbeat_timeout,           guard: "now-lastResp > interval+timeout", evidence: "WebSocketServiceImpl:799-802"}
      - {from: connected,   to: token_expired,    trigger: "code=401",                  guard: none, evidence: "XianyuWebSocketClient:283-311"}
      - {from: reconnect_wait, to: connecting,    trigger: timer,                       guard: "no live reconnect task (check-then-put)", evidence: "WebSocketServiceImpl:823-918"}
      - {from: connected,   to: stopped_manual,   trigger: stopWebSocket,               guard: none, evidence: "WebSocketServiceImpl:454-499"}
    defects:
      - id: WS1-D1
        severity: high
        summary: stopWebSocketInternal mutates state without connectionLocks; heartbeat thread can remove/close a freshly reconnected client
        evidence: "WebSocketServiceImpl:458-498, :803-806"

  - id: WS-2
    name: Socket open/close + handshake
    subsystem: connection
    storage: memory
    store_ref: XianyuWebSocketClient:32, :49
    states: [closed, open, registering, registered]
    drivers: [websocket_thread]
    transitions:
      - {from: closed,     to: open,         trigger: onOpen,           guard: none, evidence: "XianyuWebSocketClient:153-163"}
      - {from: open,       to: registered,   trigger: "headers[reg-sid]", guard: none, evidence: "XianyuWebSocketClient:323-333"}
      - {from: open,       to: closed,       trigger: onClose,          guard: none, evidence: "XianyuWebSocketClient:519-540"}
    defects:
      - {id: WS2-D1, severity: med, summary: "two sources of truth: non-volatile field `isConnected` vs method isOpen()/isClosed(); callers use both", evidence: "XianyuWebSocketClient:32,570-573,584,684"}

  - id: WS-3
    name: Heartbeat liveness
    subsystem: connection
    storage: memory
    store_ref: WebSocketServiceImpl.lastHeartbeatResponseTimes
    states: [fresh, stale, lost]
    drivers: [scheduler_1s]
    transitions:
      - {from: fresh, to: stale, trigger: no response for interval+timeout, guard: timestamp compare, evidence: "WebSocketServiceImpl:563-618"}
      - {from: stale, to: lost,  trigger: handleConnectionLost,            guard: none, evidence: "WebSocketServiceImpl:799-806"}
    defects:
      - {id: WS3-D1, severity: med, summary: "isConnectionHealthy returns true when no heartbeat response was ever recorded", evidence: "WebSocketServiceImpl:532-540"}

  - id: WS-4
    name: Token refresh cycle
    subsystem: credentials
    storage: memory
    store_ref: lastTokenRefreshTimes, captchaRetryCounts, tokenRetryTasks
    states: [fresh, refreshing, retry_wait, captcha_backoff]
    drivers: [scheduler_60s]
    transitions:
      - {from: fresh,           to: refreshing,    trigger: "elapsed >= tokenRefreshInterval", guard: none, evidence: "WebSocketServiceImpl:641-690"}
      - {from: refreshing,      to: fresh,         trigger: refresh ok,   guard: none, evidence: "WebSocketServiceImpl:730-741"}
      - {from: refreshing,      to: captcha_backoff, trigger: CaptchaRequiredException, guard: backoff cap, evidence: "WebSocketServiceImpl:749-756,768-773"}
      - {from: refreshing,      to: retry_wait,    trigger: other error,  guard: none, evidence: "WebSocketServiceImpl:760-761"}
    defects:
      - {id: WS4-D1, severity: med, summary: "success path never clears connectionRestartFlags; next natural drop is treated as a manual restart and reconnects with 0 delay", evidence: "WebSocketServiceImpl:679,357-361,830-832"}

  - id: WS-5
    name: Reconnect backoff
    subsystem: connection
    storage: memory
    store_ref: reconnectAttemptCounts, reconnectTasks
    states: [idle, scheduled, executing]
    drivers: [scheduler]
    transitions:
      - {from: idle,      to: scheduled, trigger: scheduleReconnect, guard: "no live task (check-then-put)", evidence: "WebSocketServiceImpl:823-847"}
      - {from: scheduled, to: idle,      trigger: attempt ok,        guard: none, evidence: "WebSocketServiceImpl:880"}
      - {from: scheduled, to: scheduled, trigger: attempt failed,    guard: attempt cap none (delay capped 60s), evidence: "WebSocketServiceImpl:909-913"}
    defects:
      - {id: WS5-D1, severity: low, summary: "check-then-put race can schedule two reconnect tasks; maps are never pruned per account", evidence: "WebSocketServiceImpl:825-829,917"}

  - id: WS-6
    name: Cookie validity
    subsystem: credentials
    storage: db
    store_ref: xianyu_cookie.cookie_status
    states: {1: valid, 2: expired, 3: invalid}
    drivers: [api_calls, websocket_router, token_refresh]
    transitions:
      - {from: valid,   to: expired, trigger: "401 or 500 frame / API expiry", guard: none, evidence: "WebSocketMessageRouter:166-175"}
      - {from: valid,   to: invalid, trigger: risk/invalid credential,          guard: none, evidence: "WebSocketTokenServiceImpl:401,472"}
      - {from: expired, to: valid,   trigger: hasLogin heal,                    guard: none, evidence: "CookieRefreshServiceImpl:580-600"}
    defects:
      - {id: WS6-D1, severity: high, summary: "transient 500 marks cookie expired; all readers filter cookie_status=1 so every API path fails closed", evidence: "WebSocketMessageRouter:170; AccountServiceImpl:190-194,326-330"}
      - {id: WS6-D2, severity: med, summary: "notify side effect is an untransacted read-modify-write edge detection", evidence: "AccountServiceImpl:412-449"}

  - id: WS-7
    name: QR login session
    subsystem: credentials
    storage: memory
    store_ref: QRLoginServiceImpl.sessions:41
    states: [waiting, scanned, success, verification_required, expired, cancelled, error]
    drivers: [http_poll_2s, qr_callback_thread]
    transitions:
      - {from: waiting,  to: scanned,                trigger: scan event,        guard: "status==waiting", evidence: "QRLoginServiceImpl:427-438"}
      - {from: scanned,  to: success,                trigger: confirm event,     guard: none, evidence: "QRLoginServiceImpl:494-503"}
      - {from: scanned,  to: verification_required,  trigger: captcha demand,    guard: none, evidence: "QRLoginServiceImpl:494"}
      - {from: any,      to: expired,                trigger: poll sees expired, guard: "!success", evidence: "QRLoginServiceImpl:556-558"}
      - {from: any,      to: error,                  trigger: exception,         guard: none, evidence: "QRLoginServiceImpl:657,693,698"}
    defects:
      - {id: WS7-D1, severity: med, summary: "error maps to pending in convertToFrontendStatus; verification_required/cancelled have no UI branch so the poll never stops", evidence: "QRLoginServiceImpl:604-620; QRLoginDialog.vue:67-81"}
      - {id: WS7-D2, severity: med, summary: "cleanupExpiredSessions has no scheduler; sessions (with cookie strings) leak", evidence: "QRLoginServiceImpl:41,452-461"}

  - id: WS-8
    name: Captcha solve task
    subsystem: credentials
    storage: memory
    store_ref: CaptchaSolveServiceImpl.tasks:46, TaskControl:556-564
    states: [PENDING, RUNNING, SUCCEEDED, FAILED, TIMEOUT, UNSUPPORTED, CANCELLED]
    extra_dimensions: {phase: "21 string phases, QUEUED..", attempt: "0..maxAttempts"}
    drivers: [executor, playwright_runner, http]
    transitions:
      - {from: PENDING, to: RUNNING,  trigger: executor start, guard: none, evidence: "CaptchaSolveServiceImpl:236-260"}
      - {from: RUNNING, to: SUCCEEDED, trigger: solve ok,      guard: "deadline", evidence: "CaptchaSolveServiceImpl:340-390"}
      - {from: RUNNING, to: TIMEOUT,   trigger: deadline,      guard: "deadlineAt", evidence: "CaptchaSolveServiceImpl:520-540"}
      - {from: any,     to: CANCELLED, trigger: cancel,        guard: none, evidence: "CaptchaSolveServiceImpl:400-430"}
    defects:
      - {id: WS8-D1, severity: med, summary: "Status.UNSUPPORTED unreachable (runner never returns it)", evidence: "CaptchaSolveServiceImpl:382; CaptchaBrowserRunner.Outcome"}
      - {id: WS8-D2, severity: med, summary: "phase pipeline non-monotonic: STARTING_BROWSER published before CHECKING_ENVIRONMENT", evidence: "CaptchaSolveServiceImpl:250; PlaywrightCaptchaBrowserRunner:443"}

  - id: WS-9
    name: Sync watermark
    subsystem: connection
    storage: db
    store_ref: xianyu_account.websocket_sync_pts/seq/timestamp
    states: [monotonic_pts]
    drivers: [websocket_message_thread]
    transitions:
      - {from: pts, to: higher_pts, trigger: ack, guard: "pts < ? (memory + SQL)", evidence: "WebSocketSyncCursor:16-29; XianyuAccountMapper:24-28"}
    defects:
      - {id: WS9-D1, severity: low, summary: "lower cursor silently ignored; no metric/alert on a frozen watermark", evidence: "XianyuAccountMapper:26"}

  # ─────────────────────────────── order fulfilment ───────────────────────────────
  - id: ORD-1
    name: Delivery task machine (delivery_status) with lease
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.delivery_status + lease_owner/lease_expire_time/attempt_count
    states: [PENDING, PROCESSING, RETRY_WAIT, FAILED, REVIEW_REQUIRED, COMPLETED, SKIPPED, DELIVERED_unreachable, CONFIRMING_unreachable]
    drivers: [scheduler_1s, http_retry, delivery_flow]
    transitions:
      - {from: absent,            to: PENDING,          trigger: discover,        guard: none, evidence: "DeliveryTaskServiceImpl:36-41"}
      - {from: absent,            to: SKIPPED,          trigger: auto-delivery off, guard: none, evidence: "PendingOrderPollService:78"}
      - {from: PENDING|RETRY_WAIT, to: PROCESSING,      trigger: claim,           guard: "due + FOR UPDATE + lease_expire", evidence: "XianyuGoodsOrderMapper:162-173"}
      - {from: PROCESSING,        to: COMPLETED,        trigger: complete,        guard: "none (no lease_owner check)", evidence: "XianyuGoodsOrderMapper:175-177"}
      - {from: PROCESSING,        to: RETRY_WAIT,       trigger: fail (<max),     guard: "status NOT IN (REVIEW_REQUIRED,COMPLETED)", evidence: "XianyuGoodsOrderMapper:178-185"}
      - {from: PROCESSING,        to: FAILED,           trigger: fail (>=max),    guard: "same", evidence: "DeliveryTaskServiceImpl:81-92"}
      - {from: PROCESSING,        to: RETRY_WAIT,       trigger: risk defer,      guard: none (attempt_count-1), evidence: "XianyuGoodsOrderMapper:187-192"}
      - {from: any,               to: REVIEW_REQUIRED,  trigger: markReviewRequired, guard: none, evidence: "XianyuGoodsOrderMapper:198-201"}
      - {from: FAILED|RETRY_WAIT, to: PENDING,          trigger: requeue,         guard: "state<>1", evidence: "XianyuGoodsOrderMapper:203-212"}
    defects:
      - {id: ORD1-D1, severity: high, summary: "no lease fencing on complete/retryOrFail; stale worker overwrites the new owner", evidence: "XianyuGoodsOrderMapper:175-185"}
      - {id: ORD1-D2, severity: high, summary: "terminal states re-entrant (REVIEW_REQUIRED/RETRY_WAIT/FAILED can overwrite COMPLETED)", evidence: "XianyuGoodsOrderMapper:198-201,187-192,138-151"}
      - {id: ORD1-D3, severity: med, summary: "DELIVERED and CONFIRMING are never written but rendered by the UI", evidence: "enums/DeliveryStatus.java; vue-code/src/views/orders/order-status.ts:12-22"}
      - {id: ORD1-D4, severity: med, summary: "attempt_count incremented twice on claim (SQL + Java)", evidence: "XianyuGoodsOrderMapper:170; DeliveryTaskServiceImpl:69-71"}
      - {id: ORD1-D5, severity: med, summary: "dead states + no SKIP LOCKED; ORDER BY create_time only", evidence: "XianyuGoodsOrderMapper:162-166"}

  - id: ORD-2
    name: Delivery private message machine
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.delivery_message_state/_content/_attempt_count/_next_retry_time
    states: {0: ready, 1: sent, 2: in_flight, 3: held_card, 4: held_fixed, 5: committed}
    drivers: [delivery_flow, scheduler_15s, buyer_confirm]
    transitions:
      - {from: absent, to: 0, trigger: queueDeliveryMessage,  guard: prepareDeliveryMessage, evidence: "BuyerMessageService:139-150"}
      - {from: absent, to: 3, trigger: hold (card),           guard: content not blank, evidence: "BuyerMessageService:155-174"}
      - {from: absent, to: 4, trigger: hold (fixed),          guard: content not blank, evidence: "BuyerMessageService:155-174"}
      - {from: 4,      to: 5, trigger: confirmFixedHeld,      guard: "state=4", evidence: "XianyuGoodsOrderMapper:262-265"}
      - {from: "3|5",  to: 0, trigger: activate,              guard: "content NOT NULL AND state IN (3,5)", evidence: "XianyuGoodsOrderMapper:250-255"}
      - {from: "0|2",  to: 2, trigger: claim,                 guard: "state IN (0,2) AND due", evidence: "XianyuGoodsOrderMapper:285-289"}
      - {from: 2,      to: 1, trigger: send ok,               guard: none, evidence: "XianyuGoodsOrderMapper:282-283"}
      - {from: "0|2",  to: 0, trigger: send failed,           guard: "state IN (0,2)", evidence: "XianyuGoodsOrderMapper:291-294"}
      - {from: 4,      to: 0, trigger: stale 30 min,          guard: "due", evidence: "XianyuGoodsOrderMapper:267-270"}
      - {from: 3,      to: (delivery_status=REVIEW_REQUIRED), trigger: stale no DELIVERED usage, guard: "NOT EXISTS", evidence: "XianyuGoodsOrderMapper:272-281"}
    defects:
      - {id: ORD2-D1, severity: high, summary: "state 2 is a 2-minute timer with no owner token; markDeliveryMessageSent unguarded → duplicate card message", evidence: "XianyuGoodsOrderMapper:282-289"}
      - {id: ORD2-D2, severity: med, summary: "no attempt cap, no terminal failed state; retries forever every 5 min", evidence: "BuyerMessageService:285-289"}
      - {id: ORD2-D3, severity: med, summary: "state 5 has no UI/API/doc surface; recovery depends solely on the 15s retry job", evidence: "XianyuGoodsOrderMapper:300-307; GoodsAutomationScheduler:71"}

  - id: ORD-3
    name: Fulfilment saga (boolean tuple)
    subsystem: fulfilment
    storage: db + stack
    store_ref: OrderServiceImpl:730-845 (cardDelivery, cardReservationCommitted, deliveryMessageHeld, chatDeliveryEnabled, voucherDeliveryEnabled)
    states: [combinatorial_32, handled_6]
    drivers: [http_request]
    transitions:
      - {from: start,     to: kami_reserved, trigger: reserve,  guard: none, evidence: "OrderServiceImpl:487-560, AutoDeliveryServiceImpl:457-459"}
      - {from: reserved,  to: consigned,     trigger: consign,  guard: result enum, evidence: "OrderServiceImpl:740-800"}
      - {from: consigned, to: committed,     trigger: commit+state=1, guard: none, evidence: "OrderServiceImpl:803-818"}
      - {from: any,       to: compensated,   trigger: exception, guard: boolean tuple, evidence: "OrderServiceImpl:820-845"}
    defects:
      - {id: ORD3-D1, severity: high, summary: "5 booleans = 32 combinations, ~6 branches; unhandled combinations have no assertion", evidence: "OrderServiceImpl:820-845"}

  - id: ORD-4
    name: Kami item reservation
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_kami_item.status
    states: {0: available, 1: delivered, 2: reserved, 3: review}
    drivers: [delivery_flow, admin]
    transitions:
      - {from: 0, to: 2, trigger: reserve,      guard: "status=0 FOR UPDATE", evidence: "XianyuKamiItemMapper:60-79"}
      - {from: 2, to: 1, trigger: commit,       guard: "status=2", evidence: "XianyuKamiItemMapper:81-82"}
      - {from: 2, to: 0, trigger: release,      guard: "status=2 AND config.source_type='LOCAL'", evidence: "XianyuKamiItemMapper:84-87"}
      - {from: 2, to: 3, trigger: review,       guard: "status=2", evidence: "XianyuKamiItemMapper:89-90"}
      - {from: "1|3", to: 0, trigger: markUnused, guard: "status IN (1,3)", evidence: "XianyuKamiItemMapper:57-58"}
    defects:
      - {id: ORD4-D1, severity: high, summary: "releaseReservation only matches LOCAL configs; API-sourced reservations leak forever and block config edits", evidence: "XianyuKamiItemMapper:84-87; KamiConfigServiceImpl:620"}
      - {id: ORD4-D2, severity: med, summary: "status 3 has no \"resolve as delivered\" exit; only reset to available (resale risk)", evidence: "XianyuKamiItemMapper:57-58"}

  - id: ORD-5
    name: External kami provisioning request
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_kami_external_request.request_status
    states: [PROCESSING, SUCCESS, FAILED, REVIEW_REQUIRED]
    drivers: [delivery_flow, operator]
    transitions:
      - {from: absent,     to: PROCESSING,      trigger: insertIfAbsent, guard: "unique(tenant,config,order)", evidence: "XianyuKamiExternalRequestMapper:11-22"}
      - {from: PROCESSING, to: SUCCESS,         trigger: provider ok,    guard: "status='PROCESSING'", evidence: "XianyuKamiExternalRequestMapper:57-65"}
      - {from: PROCESSING, to: "FAILED|REVIEW_REQUIRED", trigger: provider error, guard: "status='PROCESSING'", evidence: "ExternalKamiProvisionService:76-87"}
      - {from: "FAILED|stale PROCESSING", to: PROCESSING, trigger: retry, guard: "attempt<3 AND (FAILED OR stale 2min)", evidence: "XianyuKamiExternalRequestMapper:41-55"}
    defects:
      - {id: ORD5-D1, severity: high, summary: "REVIEW_REQUIRED has no exit transition in code; order/config permanently blocked (409)", evidence: "ExternalKamiProvisionService:116-119"}
      - {id: ORD5-D2, severity: med, summary: "claimRetry bumps exception_revision on every attempt, invalidating operator acks", evidence: "XianyuKamiExternalRequestMapper:48"}

  - id: ORD-6
    name: Order outcome integer
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.state
    states: {-1: failed, 0: pending, 1: success}
    drivers: [delivery_flow]
    transitions:
      - {from: "0|-1", to: 1,  trigger: delivery ok,   guard: none, evidence: "XianyuGoodsOrderMapper:138-151"}
      - {from: "0|1",  to: -1, trigger: delivery fail, guard: none, evidence: "XianyuGoodsOrderMapper:148-151"}
      - {from: -1,     to: 0,  trigger: requeue,       guard: "state<>1", evidence: "XianyuGoodsOrderMapper:207-212"}
    defects:
      - {id: ORD6-D1, severity: high, summary: "second source of truth for 'delivered'; only the mapper CASE keeps it aligned with delivery_status", evidence: "XianyuGoodsOrderMapper:139,144,149,238,251"}

  - id: ORD-7
    name: Confirm state
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.confirm_state
    states: {0: unconfirmed, 1: confirmed}
    drivers: [delivery_flow, http_confirm]
    transitions:
      - {from: 0, to: 1, trigger: updateConfirmState / confirmFixedHeldDeliveryMessage, guard: none, evidence: "XianyuGoodsOrderMapper:222-223,262-265"}
    defects:
      - {id: ORD7-D1, severity: med, summary: "unconditional UPDATE, no state guard, three writers, and coupled to delivery_message_state=5 on one path only", evidence: "OrderServiceImpl:805; AutoDeliveryServiceImpl:569,726"}

  - id: ORD-8
    name: Rate status
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.rate_status
    states: {0: not_rated, 1: rated, -1: failed}
    drivers: [scheduler_60s, http_manual]
    transitions:
      - {from: any, to: 1,  trigger: rate ok,   guard: none, evidence: "GoodsAutomationService:329,360"}
      - {from: any, to: -1, trigger: rate fail, guard: none, evidence: "GoodsAutomationService:360"}
    defects:
      - {id: ORD8-D1, severity: med, summary: "write-only control flow: eligibility is re-derived from the platform, so -1 never retries by itself", evidence: "GoodsAutomationService:285; XianyuGoodsOrderMapper:229-234"}

  - id: ORD-9
    name: Receipt follow-up drip
    subsystem: fulfilment
    storage: db
    store_ref: xianyu_goods_order.receipt_follow_up_completed/_sent_count/_next_time + buyer_confirmed_receipt
    states: [inactive, due, claimed, in_progress, completed]
    drivers: [scheduler_5s]
    transitions:
      - {from: due,      to: claimed,   trigger: claimReceiptFollowUp, guard: "sent_count match AND completed=0", evidence: "XianyuGoodsOrderMapper:321-324"}
      - {from: claimed,  to: completed, trigger: last message sent,    guard: "nextCount >= size", evidence: "GoodsAutomationService:186-192"}
      - {from: claimed,  to: in_progress, trigger: send ok,            guard: "optimistic count", evidence: "XianyuGoodsOrderMapper:326-332"}
    defects:
      - {id: ORD9-D1, severity: med, summary: "updateReceiptFollowUpProgress return ignored → duplicate send on lost optimistic update", evidence: "GoodsAutomationService:191-192"}

  - id: ORD-10
    name: Exception revision + acknowledgement
    subsystem: fulfilment
    storage: db
    store_ref: exception_revision (3 tables) + xianyu_exception_acknowledgement
    states: [open_vN, acked_vN]
    drivers: [failure writes, operator ack]
    transitions:
      - {from: open_vN,  to: open_vN+1, trigger: another failure, guard: per-writer bump, evidence: "XianyuGoodsOrderMapper:140,150,181,200,275"}
      - {from: open_vN,  to: acked_vN,  trigger: acknowledgeException, guard: "INSERT..SELECT with revision+status match", evidence: "OperationsDiagnosticsService:277-322"}
    defects:
      - {id: ORD10-D1, severity: med, summary: "revision bumped by inconsistent writer set (some failures, some retries) → acks both suppressed and invalidated", evidence: "XianyuKamiExternalRequestMapper:48; XianyuGoodsOrderMapper:181"}

  # ─────────────────────────────── messaging & auto-reply ───────────────────────────────
  - id: MSG-1
    name: Auto-reply record
    subsystem: messaging
    storage: db
    store_ref: xianyu_goods_auto_reply_record.state
    states: {0: pending, 2: claimed, 1: success, -1: failed, -2: cancelled}
    drivers: [websocket_thread, scheduler_1s, executor]
    transitions:
      - {from: absent, to: 0,  trigger: submitDelayTask,    guard: none, evidence: "AutoReplyDelayServiceImpl:243-259"}
      - {from: 0,      to: -2, trigger: new message same session, guard: "state=0", evidence: "XianyuGoodsAutoReplyRecordMapper:61-64"}
      - {from: "0|stale 2", to: 2, trigger: claim,          guard: "state=0 OR (2 AND expired)", evidence: "XianyuGoodsAutoReplyRecordMapper:56-59"}
      - {from: 2,      to: 1,  trigger: reply ok,            guard: none, evidence: "AutoReplyServiceImpl:242"}
      - {from: 2,      to: -1, trigger: reply failed/exception, guard: none, evidence: "AutoReplyServiceImpl:249; AutoReplyDelayServiceImpl:238,309,313"}
      - {from: "0|2",  to: -2, trigger: takeover/blocked,    guard: "state IN (0,2)", evidence: "XianyuGoodsAutoReplyRecordMapper:65-67"}
    defects:
      - {id: MSG1-D1, severity: high, summary: "updateStateAndContent has no lease guard (no fencing); state write failure is swallowed → duplicate reply after lease expiry", evidence: "XianyuGoodsAutoReplyRecordMapper:24-29; AutoReplyServiceImpl:280-286"}
      - {id: MSG1-D2, severity: high, summary: "replay of a message cancels the live pending reply before the dedupe INSERT resolves", evidence: "AutoReplyDelayServiceImpl:158-174,185-197; XianyuGoodsAutoReplyRecordMapper:17-23"}
      - {id: MSG1-D3, severity: med, summary: "next_retry_time read but never written; attempt_count incremented but never read → no backoff, no cap", evidence: "XianyuGoodsAutoReplyRecordMapper:52-59"}

  - id: MSG-2
    name: Delayed reply task (memory + durable row)
    subsystem: messaging
    storage: memory + db
    store_ref: AutoReplyDelayServiceImpl.pendingTasks/pendingMessages:103-116
    states: [scheduled, dispatched, cancelled]
    drivers: [websocket_thread, scheduler_1s, pool]
    transitions:
      - {from: absent,    to: scheduled,  trigger: submitDelayTask, guard: none, evidence: "AutoReplyDelayServiceImpl:153-170"}
      - {from: scheduled, to: cancelled,  trigger: newer message,   guard: none, evidence: "AutoReplyDelayServiceImpl:177-197"}
