name: Update star history chart

on:
  schedule:
    # 每日 03:00 UTC（北京时间 11:00）更新星标趋势图。
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: python -m pip install matplotlib

      - name: Generate star history chart
        run: python scripts/gen_star_history.py --refresh
        env:
          # 公开仓库使用内置令牌即可读取 stargazers 时间戳。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and merge updated charts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history-*.png
          git diff --cached --quiet && exit 0
          BRANCH="automation/star-history"
          git commit -m "docs: update star history chart [skip ci]"
          git push --force origin "HEAD:${BRANCH}"
          PR_NUMBER="$(gh pr list --base main --head "${BRANCH}" --state open --json number --jq '.[0].number')"
          if [ -z "${PR_NUMBER}" ]; then
            PR_URL="$(gh pr create --base main --head "${BRANCH}" --title "docs: update star history chart" --body "Automated daily star history chart update.")"
            PR_NUMBER="${PR_URL##*/}"
          fi
          gh pr merge "${PR_NUMBER}" --squash --delete-branch
