name: Update star history chart

on:
  schedule:
    # 每日 03:00 UTC（北京时间 11:00）更新星标趋势图。
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: false

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: python -m pip install matplotlib

      - name: Generate star history chart
        run: python scripts/gen_star_history.py --refresh
        env:
          # 公开仓库使用内置令牌即可读取 stargazers 时间戳。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated charts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/star-history-*.png
          git diff --cached --quiet && exit 0
          git commit -m "docs: update star history chart [skip ci]"
          git push
